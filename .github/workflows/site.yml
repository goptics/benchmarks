name: site
on:
  push:
    branches: [main]
    paths: ["*/bench/*.txt", "Taskfile.yml", "worker/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["*/bench/*.txt", "Taskfile.yml", "worker/**", ".github/workflows/site.yml"]
  workflow_dispatch:

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - if: hashFiles('pool/bench/*.txt', 'redis/bench/*.txt', 'sqlite/bench/*.txt') == ''
        run: echo "::notice::no bench txt on this ref yet, nothing to build"
      - if: hashFiles('pool/bench/*.txt', 'redis/bench/*.txt', 'sqlite/bench/*.txt') != ''
        run: |
          sh -c "$(curl -fsSL https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin" v3.50.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p worker/public
      # installs the latest vizb v0.x (cached) and builds the lazy-catalog page;
      # the binary stays on PATH for the conversions below
      - if: hashFiles('pool/bench/*.txt', 'redis/bench/*.txt', 'sqlite/bench/*.txt') != ''
        uses: goptics/vizb@v0
        with:
          data-url: https://benchmarks.goptics.org/dataset
          charts: bar
          output-html: worker/public/index.html
      - if: hashFiles('pool/bench/*.txt', 'redis/bench/*.txt', 'sqlite/bench/*.txt') != ''
        run: task site:json
      - if: hashFiles('pool/bench/*.txt', 'redis/bench/*.txt', 'sqlite/bench/*.txt') != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy
