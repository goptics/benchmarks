version: "3"

tasks:
  test:
    desc: Vet and run every subject through a small job set (needs a C compiler)
    cmds:
      - go vet ./...
      - go test ./...

  bench:
    desc: Every scenario and subject once
    cmds:
      - go test -run xxx -bench . -benchtime=1x -timeout 0

  txt:
    desc: Full run into bench/sqlite.txt (real disk; SQLITEQ_BENCH_DIR picks it; about 20 min)
    cmds:
      - mkdir -p bench
      - set -o pipefail; go test -run xxx -bench . -benchtime=2x -timeout 0 | tee bench/sqlite.txt
